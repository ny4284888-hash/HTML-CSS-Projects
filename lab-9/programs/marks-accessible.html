<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Marks Table</title>
</head>
<body>

    <h1>Accessible Marks Table</h1>

    <table border="1">
        <caption>Marks of Class A</caption>

        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Maths</th>
                <th scope="col">Science</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">POOJA</th>
                <td>78</td>
                <td>85</td>
            </tr>

            <tr>
                <th scope="row">KHUSHI</th>
                <td>64</td>
                <td>70</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
