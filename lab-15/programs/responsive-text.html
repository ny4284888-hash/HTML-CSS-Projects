<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Text</title>

    <style>
        body {
            font-size: 1rem;
        }

        h1 {
            font-size: 1.5rem;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Text Example</h1>

    <p>This paragraph uses a font size of 1rem.</p>

</body>
</html>
