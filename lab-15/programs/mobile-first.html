<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First Layout</title>

    <style>
        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 20px;
            border-radius: 10px;
        }

        @media (min-width: 600px) {
            .cards {
                flex-direction: row;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Mobile First Layout</h1>

    <div class="cards">
        <div class="card">
            <h2>First Card</h2>
            <p>This is the first responsive card.</p>
        </div>

        <div class="card">
            <h2>Second Card</h2>
            <p>This is the second responsive card.</p>
        </div>
    </div>

</body>
</html>
