<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;
            padding: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>CSS Card Example</h1>

    <div class="card">
        <h3>My First Card</h3>
        <p>This is a simple card created using CSS.</p>
    </div>

</body>
</html>
