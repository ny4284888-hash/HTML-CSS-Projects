<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Scrolling</title>

    <style>
        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid navy;
            padding: 10px;
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>CSS Scrolling Example</h1>

    <div class="scroll-box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>

</body>
</html>
